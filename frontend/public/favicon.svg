<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0A0E1A"/>
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Radio wave arcs -->
  <path d="M10 18 Q16 10 22 18" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M7 21 Q16 7 25 21" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Center dot (antenna base) -->
  <circle cx="16" cy="21" r="2.5" fill="white"/>
</svg>
